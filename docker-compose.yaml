services:
  libcoap-proxy:
    build:
      context: ./coap2http-proxy
      dockerfile: Dockerfile
    image: my-coap2http-server
    container_name: my-coap2http-server
    network_mode: host
    stdin_open: true
    tty: true
    command: ["./build/coap2HttpServer", "-A", "::", "-n", "-c", "/home/coap2http-proxy/wolfssl/certs/server-ecc.pem", "-j", "/home/coap2http-proxy/wolfssl/certs/ecc-key.pem", "-C", "/home/coap2http-proxy/wolfssl/certs/ca-ecc-cert.pem", "-P", ",my_proxy"]
    restart: "no"

  nginx-proxy:
    build:
      context: ./nginx_reverse_proxy/quantis-qrng-tls-pq-bench/quantis-qrng-nginx
      dockerfile: Dockerfile
    image: oqs-nginx
    container_name: oqs-nginx
    network_mode: host
    ports:
      - "4433:4433"
    restart: "no"

  qrng-api:
    build:
      context: ./eaas-quantis-qrng-api
      dockerfile: Dockerfile
    image: qrng-api
    container_name: qrng-api
    network_mode: host
    stdin_open: true
    tty: true
    ports:
      - "6065:6065"
    command: ["./eaas-quantis-qrng-api"]
    restart: "no"
